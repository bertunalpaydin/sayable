<div class="recorder" data-recorder>
  <button type="button" class="record" data-record aria-label="Start recording">
    <span class="record-dot" aria-hidden="true"></span>
  </button>
  <div>
    <p class="record-label" data-record-label>Press to record, then read the text out loud.</p>
    <p class="muted small" data-record-time></p>
  </div>
</div>
