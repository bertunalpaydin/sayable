<section class="result" data-result hidden aria-live="polite">
  <h2 data-result-title>How it was heard</h2>
  <p class="notice" data-not-counted hidden>Most of the words did not match the text, so this take
    was not added to your profile. Check that you read the text shown, in a quiet room, and try again.</p>
  <p class="reading marked" data-result-text></p>
  <p class="muted small">Heard: <span data-result-heard></span></p>
  <ul class="legend small">
    <li><span class="word is-misheard">word</span> heard as something else</li>
    <li><span class="word is-missed">word</span> not heard</li>
    <li><span class="word is-unclear">word</span> heard, but only just</li>
  </ul>
</section>
